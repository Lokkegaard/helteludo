# Netlify: kun selve spillet udgives (index.html sender videre til helteludo.html).
# Motortesten køres først; fejler den, udgives intet, og den gamle version bliver liggende.
[build]
  command = "node tests/motor.js && mkdir -p dist && cp index.html helteludo.html dist/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
